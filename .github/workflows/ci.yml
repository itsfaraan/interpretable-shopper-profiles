name: CI/CD Pipeline

# 1. Triggers: When should this workflow run?
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ==========================================
  # JOB 1: CONTINUOUS INTEGRATION (TESTING)
  # ==========================================
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run tests
      run: |
        pytest

    - name: Test Docker Build
      run: |
        docker build -t shopper-profiles-app:test .

  # ==========================================
  # JOB 2: CONTINUOUS DEPLOYMENT (GOOGLE CLOUD)
  # ==========================================
  deploy-to-google:
    needs: build-and-test
    # Pro-tip: This ensures it only deploys to production when code is pushed directly to main
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Authenticate to Google Cloud
      id: auth
      uses: google-github-actions/auth@v2
      with:
        credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2
      
    - name: Configure Docker for Google Artifact Registry
      run: gcloud auth configure-docker europe-west8-docker.pkg.dev

    - name: Build and Push Docker Image
      env:
        # Assuming you named your Artifact Registry repository 'app-repo' 
        IMAGE_NAME: europe-west8-docker.pkg.dev/shopper-profiles/app-repo/shopper-profiles-app:latest
      run: |
        docker build -t $IMAGE_NAME .
        docker push $IMAGE_NAME

    - name: Deploy to Cloud Run
      uses: google-github-actions/deploy-cloudrun@v2
      with:
        service: shopper-profiles-app
        image: europe-west8-docker.pkg.dev/shopper-profiles/app-repo/shopper-profiles-app:latest
        region: europe-west8
        flags: '--port=8501 --allow-unauthenticated'